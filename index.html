<style>
:root{
  --bg:#060B1A;--surface:#0C1428;--surface2:#121C36;--border:#1D2A4A;
  --text:#EAF1FB;--muted:#8796B5;
  --primary:#19E3B5;--primary2:#3FF3CC;--cyan:#22C7E6;--green:#34D399;--amber:#F5B544;--red:#F0506E;
  --grad:linear-gradient(135deg,#2EF2C2 0%,#16B8DE 100%);--r:14px
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:var(--primary2);text-decoration:none;cursor:pointer}
h1,h2,h3{font-family:'Space Grotesk',Inter,sans-serif;letter-spacing:-.02em;line-height:1.15}
h3{font-size:17px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)}.small{font-size:13px}small{display:block;font-size:12.5px}
.green-t{color:var(--green)}.red-t{color:var(--red)}.amber-t{color:var(--amber)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:11px;border:1px solid transparent;font:600 14px Inter,sans-serif;cursor:pointer;transition:.15s;white-space:nowrap;color:var(--text);background:var(--surface2)}
.btn:hover{filter:brightness(1.1)}
.btn.primary{background:var(--grad);color:#04121F;box-shadow:0 6px 20px -6px rgba(25,227,181,.6)}
.btn.ghost{background:transparent;border-color:var(--border)}.btn.ghost:hover{background:var(--surface2)}
.btn.danger{background:var(--red);color:#fff}.btn.success{background:var(--green);color:#03241A}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:9px}
.btn.lg{height:50px;padding:0 26px;font-size:15px}
.btn.block{width:100%}.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;flex:none;transition:.15s}
.icon-btn:hover{color:var(--text);background:var(--surface2)}
.icon-btn.red:hover{color:var(--red);border-color:var(--red)}.icon-btn.green:hover{color:var(--green);border-color:var(--green)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px}
.card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.row{display:flex;align-items:center}.between{justify-content:space-between}.gap{gap:10px}.grow{flex:1;min-width:0}.center{text-align:center}.wrap{flex-wrap:wrap}.right{text-align:right}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stack>*+*{margin-top:16px}
.stat{display:flex;gap:14px;align-items:center}
.stat .si{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.stat b{font:700 20px 'Space Grotesk',sans-serif;display:block;white-space:nowrap}
.t-primary{color:var(--primary2);background:rgba(25,227,181,.15)}.t-green{color:var(--green);background:rgba(25,211,162,.13)}
.t-cyan{color:var(--cyan);background:rgba(34,199,230,.13)}.t-amber{color:var(--amber);background:rgba(245,181,68,.13)}.t-red{color:var(--red);background:rgba(240,80,110,.13)}
.badge{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted);white-space:nowrap;flex:none}
.badge.green{background:rgba(25,211,162,.13);color:var(--green)}.badge.amber{background:rgba(245,181,68,.13);color:var(--amber)}
.badge.red{background:rgba(240,80,110,.13);color:var(--red)}.badge.primary{background:rgba(25,227,181,.16);color:var(--primary2)}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .5s}
.bar.sm{height:6px;margin:6px 0 4px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--border)}
.li:first-child{border-top:0}
.li .b{color:var(--text);font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .acts{display:flex;gap:6px;flex:none}
.nums{text-align:right;flex:none}.nums b{font-size:14px;display:block;white-space:nowrap}
.plat{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none;cursor:pointer}
.av.sm{width:32px;height:32px;font-size:12px}.av.lg{width:56px;height:56px;font-size:18px}
.form{display:flex;flex-direction:column;gap:14px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{font:500 15px Inter,sans-serif;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:11px 13px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(25,227,181,.2)}
input[readonly]{opacity:.6}
textarea{min-height:90px;resize:vertical}
input[type=color]{padding:3px;height:44px;cursor:pointer}
.check{flex-direction:row;align-items:center;gap:8px;font-weight:500;color:var(--text);cursor:pointer}.check input{width:18px;height:18px;accent-color:var(--primary)}
.checks{display:flex;flex-wrap:wrap;gap:8px 16px}
.hint{font-size:12.5px;color:var(--muted);background:var(--surface2);border-radius:10px;padding:10px 12px;font-weight:500}
.tabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tab{height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--border);background:transparent;color:var(--muted);font:600 13px Inter,sans-serif;cursor:pointer;white-space:nowrap}
.tab span{opacity:.7;margin-left:4px}.tab.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:600;background:rgba(255,255,255,.14);color:#fff}
.chip.sm{background:var(--surface2);color:var(--muted);height:24px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.empty{text-align:center;padding:36px 16px}
.empty .ei{width:56px;height:56px;border-radius:16px;margin:0 auto 14px;display:grid;place-items:center;background:var(--surface2);color:var(--muted)}
.empty p{margin:6px 0 16px}
.search{position:relative;flex:1;min-width:200px}.search input{padding-left:40px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
/* shell */
.app{display:flex;min-height:100vh}
.side{width:248px;flex:none;border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;font:700 19px 'Space Grotesk',sans-serif;padding:4px 8px 22px;color:var(--text)}
.logo em{font-style:normal;font-size:11px;font-family:Inter;font-weight:700;background:var(--surface2);color:var(--amber);padding:2px 7px;border-radius:6px}
.side nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav{display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border-radius:10px;color:var(--muted);font:600 14px Inter,sans-serif;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.nav:hover{background:var(--surface2);color:var(--text)}
.nav.on{background:rgba(25,227,181,.12);color:#fff}.nav.on svg{color:var(--primary2)}
.cnt{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;padding:0 6px;border-radius:99px;display:grid;place-items:center}
.side-foot{border-top:1px solid var(--border);padding-top:12px}
.me{display:flex;align-items:center;gap:10px;padding:6px 8px 10px;min-width:0}.me b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{flex:1;min-width:0;padding:28px 32px 60px;max-width:1260px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}
.top h1{font-size:26px}.top p{margin-top:4px}
.mtop,.bottom{display:none}
.toasts{position:fixed;top:16px;right:16px;left:16px;z-index:200;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none}
.toast{background:var(--surface2);border:1px solid var(--border);border-left:4px solid var(--green);padding:12px 16px;border-radius:10px;font-size:14px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.45);animation:tin .25s;max-width:360px;pointer-events:auto}
.toast.err{border-left-color:var(--red)}.toast.out{opacity:0;transform:translateY(-6px);transition:.3s}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
.modal-bg{position:fixed;inset:0;background:rgba(3,5,12,.72);backdrop-filter:blur(4px);z-index:100;display:grid;place-items:center;padding:16px;animation:tin .2s}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:18px;width:100%;max-width:480px;max-height:90vh;overflow:auto}
.modal.wide{max-width:760px}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:1}
.modal-h h3{font-size:18px}.modal-b{padding:20px}.modal-f{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.kv div{background:var(--surface2);border-radius:10px;padding:10px 12px}.kv b{display:block;font-size:16px}
/* ranks */
.ranks{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:16px 0}
.rk{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px 14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.rk.on{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 12px 32px -12px var(--c)}
.rk-ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.rk-ic svg{width:22px;height:22px}
.rk b{color:var(--c);font-size:14px}
.lb-r{display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px}
.lb-r.me{background:rgba(25,227,181,.13)}
.pos{width:26px;text-align:center;font-weight:800;color:var(--muted);flex:none}
.pos.p1{color:#F5B544}.pos.p2{color:#C3CBDA}.pos.p3{color:#C9875A}
/* campaigns */
.camp{padding:0;overflow:hidden;display:flex;flex-direction:column}
.camp-top{height:112px;padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;position:relative}
.rate b{font:700 22px 'Space Grotesk',sans-serif;color:#fff}.rate small{color:rgba(255,255,255,.75);display:inline;margin-left:4px}
.camp-b{padding:16px;flex:1;display:flex;flex-direction:column}
.camp-b .acts{margin-top:auto;padding-top:14px;display:flex;gap:8px}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;margin-top:6px}
@media(max-width:1100px){.grid4{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:repeat(2,1fr)}.ranks{grid-template-columns:repeat(3,1fr)}}
@media(max-width:820px){
  .side{display:none}.app{flex-direction:column}.main{padding:16px 16px 100px}
  .mtop{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:20}
  .mtop .logo{padding:0;font-size:17px}
  .bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);z-index:20;padding:6px 4px calc(6px + env(safe-area-inset-bottom));overflow-x:auto}
  .bottom a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted);padding:6px 2px;min-width:60px;position:relative}
  .bottom a.on{color:var(--primary2)}.bottom .cnt{position:absolute;top:0;right:8px;min-width:16px;height:16px;font-size:10px}
  .top h1{font-size:22px}.top .btn span{display:none}.top .btn{width:44px;padding:0}
  .grid2,.grid3{grid-template-columns:1fr}.grid4{gap:10px}.card{padding:16px}
  .stat{flex-direction:column;align-items:flex-start;gap:10px}.stat b{font-size:17px}
  .ranks{grid-template-columns:repeat(2,1fr)}.kv{grid-template-columns:1fr 1fr}
  .li{flex-wrap:wrap;row-gap:8px}.li>.grow{flex:1 1 calc(100% - 52px)}.li>.plat+.grow~.nums,.li>.av+.grow~.nums{margin-left:50px;text-align:left}.li>.nums{flex:1}.hide-m{display:none!important}
  .toasts{align-items:stretch}.toast{max-width:none}
}

.land{max-width:1180px;margin:0 auto;padding:0 20px}
.lh{display:flex;justify-content:space-between;align-items:center;padding:18px 0}.lh .logo{padding:0}
.hero{text-align:center;padding:70px 0 50px;position:relative}
.hero:before{content:"";position:absolute;inset:-40px 10% auto;height:380px;background:radial-gradient(closest-side,rgba(25,227,181,.35),transparent),radial-gradient(closest-side at 70% 40%,rgba(34,199,230,.22),transparent);filter:blur(30px);z-index:-1}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:99px;background:var(--surface);border:1px solid var(--border);font-size:13px;font-weight:600;color:var(--muted)}
.pill svg{color:var(--amber);width:16px;height:16px}
.hero h1{font-size:clamp(36px,6.4vw,68px);margin:22px auto 18px;max-width:820px}
.gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero>p{color:var(--muted);font-size:18px;max-width:620px;margin:0 auto 30px}
.hstats{display:flex;justify-content:center;gap:16px;margin-top:46px;flex-wrap:wrap}
.hstats div{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 26px;min-width:160px}
.hstats b{font:700 28px 'Space Grotesk',sans-serif;display:block}
.sec{padding:46px 0}.sec>h2{font-size:30px;text-align:center;margin-bottom:10px}.sec>.grid4,.sec>.grid3{margin-top:24px}
.step{position:relative}.step .si{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;margin-bottom:14px}.step h3{margin-bottom:6px}
.step .num{position:absolute;top:16px;right:18px;font:700 26px 'Space Grotesk',sans-serif;color:var(--border)}
.cta{text-align:center;padding:56px 24px;margin:30px 0;border-radius:22px;background:linear-gradient(135deg,rgba(25,227,181,.25),rgba(34,199,230,.12));border:1px solid var(--border)}
.cta h2{font-size:32px}.cta p{margin:8px 0 22px}
.foot{text-align:center;padding:24px 0 40px;border-top:1px solid var(--border)}
@media(max-width:820px){.hero{padding:40px 0 30px}.hero>p{font-size:16px}.hstats div{min-width:0;flex:1;padding:12px}.hstats b{font-size:22px}.sec{padding:30px 0}.sec>h2{font-size:24px}}

.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(600px 300px at 50% 20%,rgba(25,227,181,.22),transparent)}
.login .card{width:100%;max-width:400px;padding:28px}
.chart{display:flex;align-items:flex-end;gap:10px;height:170px}
.chart>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart i{width:100%;max-width:40px;background:var(--grad);border-radius:7px 7px 3px 3px;min-height:4px;transition:height .5s}
.rk-row{display:grid;grid-template-columns:1.2fr 1fr 64px 2fr 36px;gap:8px;align-items:center;margin-bottom:8px}
.nums b a,.li small a{color:var(--primary2)}
.li .b svg{width:13px;height:13px;vertical-align:-1px;opacity:.6}
@media(max-width:820px){.rk-row{grid-template-columns:1fr 1fr 52px 36px}.rk-row input[name=perks]{grid-column:1/-1;grid-row:2}.rk-row>button{grid-row:1;grid-column:4}.rk-row{padding-bottom:10px;border-bottom:1px solid var(--border);margin-bottom:12px}}

/* ===== Clexiq ===== */
.logo img{width:36px;height:36px;flex:none}
.wm{font:700 21px 'Space Grotesk',Inter,sans-serif;letter-spacing:-.5px;color:#F4F8FF}
.wm .x{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.av{overflow:hidden;background:var(--surface2)}.av img{width:100%;height:100%;object-fit:cover}
.btn.google{background:#fff;color:#1F1F1F;border-color:#DADCE0;width:100%}.btn.google svg{width:18px;height:18px}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;font-weight:600;margin:4px 0}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--border)}
.btn.busy{pointer-events:none;opacity:.7}.btn.busy:after{content:"";width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader{display:grid;place-items:center;min-height:60vh}.loader:after{content:"";width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
.boot{min-height:100vh;display:grid;place-items:center}
.notice{border:1px solid rgba(245,181,68,.35);background:rgba(245,181,68,.08);color:var(--amber);border-radius:12px;padding:12px 14px;font-size:13px;font-weight:500}
.secure{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;justify-content:center}.secure svg{width:14px;height:14px;color:var(--primary)}
a.nav{text-decoration:none}
/* sélecteur de langue */
select.lang{width:auto;height:38px;padding:0 30px 0 12px;font-size:13px;font-weight:600;border-radius:10px;background:var(--surface2);cursor:pointer}
select.lang.sm{height:34px;padding:0 24px 0 8px;font-size:12px}
select.lang.block{width:100%;margin-bottom:10px}
.notice .btn{flex:none}
@media(max-width:820px){.lh select.lang{height:38px}.lh .row.gap{gap:8px}}

async function loadAll() {
  const uid = auth.currentUser.uid;
  const [p, clips, camps, pays, lb, chs] = await Promise.all([
    getDoc(doc(db, 'users', uid)),
    getDocs(query(collection(db, 'clips'), where('userId', '==', uid))),
    getDocs(query(collection(db, 'campaigns'), where('status', '==', 'active'))),
    getDocs(query(collection(db, 'payouts'), where('userId', '==', uid))),
    getDocs(query(collection(db, 'leaderboard'), orderBy('views', 'desc'), limit(20))),
    getDocs(query(collection(db, 'channels'), where('userId', '==', uid)))
  ]);
  const prof = p.data();
  if (!prof || prof.status !== 'active') { await signOut(auth); toast(t(prof && prof.status === 'suspended' ? 'Ton compte a été suspendu.' : 'Ce compte n\'est plus actif.'), 'err'); throw new Error('stop') }
  Object.assign(me, prof);
  const cl = listOf(clips).sort(byNewest);
  D = {
    clips: cl, camps: listOf(camps).sort(byNewest), pays: listOf(pays).sort(byNewest), lb: listOf(lb), channels: listOf(chs).sort(byNewest),
    stats: { views: +me.views || 0, earned: +me.earned || 0, paid: +me.paid || 0, pending_pay: +me.pending || 0, balance: balanceOf(me),
      clips: cl.length, approved: cl.filter(c => c.status === 'approved').length, pending: cl.filter(c => c.status === 'pending').length, rejected: cl.filter(c => c.status === 'rejected').length }
  };
  const pos = D.lb.findIndex(x => x.id === uid); D.stats.position = pos >= 0 ? pos + 1 : null;
}

}

  const s = D.stats, r = rankOf(s.views), [ti, sub] = TITLES[view];
  const adminLink = me.isAdmin ? `<a class="nav" href="admin.html">${ic('shield')}<span>${t('Panel admin')}</span></a>` : '';
  const chPend = D.channels.filter(c => c.status === 'pending').length;
  root().innerHTML = `<div class="app">
  <div class="mtop"><div class="logo">${logo()}</div><div class="row gap">${langSelect('sm')}<div data-a="go" data-v="profile">${avatar(me.name, me.photo, r.cur.color, 'sm')}</div><button class="icon-btn" data-a="logout" aria-label="${t('Déconnexion')}">${ic('logout')}</button></div></div>
  <aside class="side"><div class="logo">${logo()}</div><nav>${NAV.map(([k, l, i]) => `<button class="nav ${view === k ? 'on' : ''}" data-a="go" data-v="${k}">${ic(i)}<span>${t(l)}</span>${k === 'clips' && s.pending ? `<span class="cnt" style="background:var(--amber);color:#2A1B00">${s.pending}</span>` : ''}${k === 'channels' && chPend ? `<span class="cnt" style="background:var(--amber);color:#2A1B00">${chPend}</span>` : ''}</button>`).join('')}${adminLink}</nav>
  <div class="side-foot">${langSelect('block')}<div class="me" data-a="go" data-v="profile">${avatar(me.name, me.photo, r.cur.color)}<div style="min-width:0"><b>${esc(me.name)}</b><small style="color:${safeColor(r.cur.color)}">${esc(t(r.cur.name))} · ${money(s.balance)}</small></div></div>
  <button class="nav" data-a="logout">${ic('logout')}<span>${t('Déconnexion')}</span></button></div></aside>
  <main class="main"><header class="top"><div><h1>${t(ti)}</h1><p class="muted small">${t(sub)}</p></div><button class="btn primary" data-a="submit" aria-label="${t('Soumettre un clip')}">${ic('plus')}<span>${t('Soumettre un clip')}</span></button></header>${V[view](s, r)}</main>
  <nav class="bottom">${NAV.filter(n => BOTTOM.includes(n[0])).map(([k, l, i]) => `<a class="${view === k ? 'on' : ''}" data-a="go" data-v="${k}">${ic(i)}${t(l)}</a>`).join('')}</nav></div>`;
  bindView();
}
A.clipTab = k => { clipFilter = k; render() };
A.copy = async v => { try { await navigator.clipboard.writeText(v); toast(t('Copié !')) } catch (e) { toast(v) } };

function bindView() {
  const pf = $('#payF'); if (pf) pf.onsubmit = async e => {
    e.preventDefault(); const f = Object.fromEntries(new FormData(pf)), a = cents(f.amount), btn = pf.querySelector('button'), acc = String(f.account || '').trim();
    if (!(a >= (+SET.minPayout || 0))) return toast(t('Montant minimum : {m}', { m: money(SET.minPayout) }), 'err');
    if (a > D.stats.balance) return toast(t('Solde insuffisant.'), 'err');
    if (!BEP20.test(acc)) return toast(t('Adresse USDT BEP20 invalide : elle commence par 0x et contient 42 caractères.'), 'err');
    if (!await confirmBox(t('Confirmer le retrait ?'), t('Tu demandes {a} en USDT sur le réseau BEP20 vers l\'adresse {acc}. Vérifie-la caractère par caractère : un envoi est irréversible.', { a: `<b>${money(a)}</b>`, acc: `<b style="word-break:break-all">${esc(acc)}</b>` }), t('Confirmer'), false)) return;
    busy(btn, true);
    try {
      const uid = auth.currentUser.uid, pref = doc(collection(db, 'payouts')), b = writeBatch(db);
      b.set(pref, { userId: uid, userName: me.name, userEmail: me.email, amount: a, method: 'USDT BEP20', account: acc, status: 'pending', createdAt: serverTimestamp(), processedAt: null });
      b.update(doc(db, 'users', uid), { pending: increment(a), lastPayout: pref.id });
      await b.commit(); toast(t('Demande de retrait envoyée.')); await refresh(true);
    } catch (err) { toast(errMsg(err), 'err') } finally { busy(btn, false) }
  };
  const prf = $('#profF'); if (prf) prf.onsubmit = async e => {
    e.preventDefault(); const f = Object.fromEntries(new FormData(prf)), btn = prf.querySelector('button[type=submit]');
    const name = String(f.name || '').trim().slice(0, 60), country = f.country || '';
    if (!name) return toast(t('Indique ton nom.'), 'err');
    if (country && !await confirmBox(t('Confirmer ton pays ?'), t('Tu as choisi {c}. Ce choix est définitif et ne pourra plus être modifié.', { c: `<b>${flag(country)} ${esc(countryName(country))}</b>` }), t('Confirmer'), false)) return;
    busy(btn, true);
    try {
      const uid = auth.currentUser.uid, b = writeBatch(db), upd = { name };
      if (country && !me.country) upd.country = country;
      b.update(doc(db, 'users', uid), upd);
      if (!me.isAdmin) b.set(doc(db, 'leaderboard', uid), { name, handle: '', photo: me.photo || '' }, { merge: true });
      await b.commit(); toast(t('Profil mis à jour.')); await refresh(true);
    } catch (err) { toast(errMsg(err), 'err') } finally { busy(btn, false) }
  };
  const pw = $('#pwF'); if (pw) pw.onsubmit = async e => {
    e.preventDefault(); const f = Object.fromEntries(new FormData(pw)), btn = pw.querySelector('button');
    if (!validPassword(f.nw)) return toast(t('Mot de passe trop faible : 8 caractères minimum, avec lettres et chiffres.'), 'err'); if (f.nw !== f.nw2) return toast(t('Les deux mots de passe sont différents.'), 'err');
    busy(btn, true); try { await updatePassword(auth.currentUser, f.nw); pw.reset(); toast(t('Mot de passe modifié.')) } catch (err) { toast(errMsg(err), 'err') } finally { busy(btn, false) }
  };
}

/* ---------- Chaînes ---------- */
function newCode() { const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', r = crypto.getRandomValues(new Uint8Array(6)); return 'CLX-' + [...r].map(x => a[x % a.length]).join('') }
A.addChannel = () => {
  openModal(t('Relier une chaîne'), `<form id="chF" class="form">
  <label>${t('Plateforme')}<select name="platform">${PLATFORMS.map(p => `<option>${p}</option>`).join('')}</select></label>
  <label>${t('Nom d\'utilisateur de la chaîne')}<input name="handle" required maxlength="31" placeholder="@toncompte" autocomplete="off" spellcheck="false"></label>
  <p class="hint">${t('Tu recevras un code unique à placer dans la bio de cette chaîne. C\'est ce qui prouve qu\'elle t\'appartient : personne d\'autre ne pourra la relier.')}</p>
  <button class="btn primary block" type="submit">${t('Obtenir mon code')}</button></form>`);
  $('#chF').onsubmit = async e => {
    e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)), btn = e.target.querySelector('button');
    const h = String(f.handle || '').trim().replace(/^@/, '');
    if (!/^[A-Za-z0-9._-]{2,30}$/.test(h)) return toast(t('Nom d\'utilisateur invalide (lettres, chiffres, point, tiret, tiret bas).'), 'err');
    if (D.channels.length >= 50) return toast(t('Nombre maximum de chaînes atteint.'), 'err');
    const id = f.platform.toLowerCase() + '_' + h.toLowerCase();
    busy(btn, true);
    try {
      await setDoc(doc(db, 'channels', id), { userId: auth.currentUser.uid, userName: me.name, platform: f.platform, handle: h, code: newCode(), status: 'pending', createdAt: serverTimestamp(), reviewedAt: null });
      closeModal(); toast(t('Chaîne ajoutée. Place maintenant le code dans ta bio.')); view = 'channels'; await refresh(true);
    } catch (err) { toast(err && err.code === 'permission-denied' ? t('Cette chaîne est déjà reliée à un compte Clexiq.') : errMsg(err), 'err') } finally { busy(btn, false) }
  };
};
A.chSubmit = async id => {
  const c = D.channels.find(x => x.id === id);
  if (!await confirmBox(t('Code placé ?'), t('Vérifie que le code {c} est bien visible dans ta bio, puis confirme. L\'équipe va contrôler ta chaîne.', { c: `<b>${esc(c.code)}</b>` }), t('Confirmer'), false)) return;
  try { await updateDoc(doc(db, 'channels', id), { status: 'submitted' }); toast(t('Demande envoyée. Garde le code jusqu\'à la validation.')); await refresh(true) } catch (e) { toast(errMsg(e), 'err') }
};
A.delChannel = async id => {
  if (!await confirmBox(t('Supprimer cette chaîne ?'), t('Tu ne pourras plus soumettre de clips depuis cette chaîne, sauf si tu la relies à nouveau.'), t('Supprimer'))) return;
  try { await deleteDoc(doc(db, 'channels', id)); toast(t('Chaîne supprimée.')); await refresh(true) } catch (e) { toast(errMsg(e), 'err') }
};

/* ---------- Clips ---------- */
A.submit = cid => {
  const act = D.camps.filter(c => (+c.spent || 0) < c.budget), vch = verifiedChannels();
  if (!vch.length) { view = 'channels'; render(); return toast(t('Relie et fais vérifier une chaîne avant de soumettre un clip.'), 'err') }
  if (!act.length) return toast(t('Aucune campagne ouverte pour le moment.'), 'err');
  const sel = act.find(c => c.id === cid) || act[0];
  const chOpts = k => { const L = vch.filter(c => (k.platforms || []).includes(c.platform)); return L.length ? L.map(c => `<option value="${esc(c.id)}">${esc(c.platform)} · @${esc(c.handle)}</option>`).join('') : `<option value="">${t('Aucune chaîne vérifiée pour cette campagne')}</option>` };
  openModal(t('Soumettre un clip'), `<form id="subF" class="form">
  <label>${t('Campagne')}<select name="campaign" data-ch="subCamp" required>${act.map(k => `<option value="${esc(k.id)}" ${k.id === sel.id ? 'selected' : ''}>${esc(k.title)} — ${money(k.rate)}${t('/1K')}</option>`).join('')}</select></label>
  <label>${t('Chaîne de publication')}<select name="channel" id="subCh">${chOpts(sel)}</select></label>
  <label>${t('Lien de la publication')}<input name="url" type="url" inputmode="url" required maxlength="500" placeholder="https://www.tiktok.com/@toncompte/video/..."></label>
  <label>${t('Titre / accroche')}<input name="title" maxlength="90" placeholder="${t('Ex : Le moment où tout bascule')}"></label>
  <label>${t('Vues actuelles')}<input name="views" type="number" inputmode="numeric" min="0" value="0"></label>
  <p class="hint">${t('Chaque clip est vérifié par l\'équipe. Seules les vues vérifiées sont rémunérées. Les clips trompeurs ou à vues achetées sont refusés.')}</p>
  <button class="btn primary block" type="submit">${t('Envoyer pour validation')}</button></form>`);
  A.subCamp = v => { const k = act.find(c => c.id === v); if (k) $('#subCh').innerHTML = chOpts(k) };
  $('#subF').onsubmit = async e => {
    e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)), url = String(f.url).trim(), btn = e.target.querySelector('button[type=submit]');
    const k = act.find(c => c.id === f.campaign), ch = vch.find(c => c.id === f.channel);
    if (!ch) return toast(t('Choisis une chaîne vérifiée acceptée par cette campagne.'), 'err');
    if (!URL_OK[ch.platform].test(url)) return toast(t('Colle le lien complet de la vidéo {p}.', { p: ch.platform }), 'err');
    if (ch.platform === 'TikTok' && !url.toLowerCase().includes('/@' + ch.handle.toLowerCase() + '/')) return toast(t('Ce lien TikTok ne vient pas de la chaîne @{h}.', { h: ch.handle }), 'err');
    if (D.clips.some(c => c.url.toLowerCase() === url.toLowerCase())) return toast(t('Tu as déjà soumis ce lien.'), 'err');
    busy(btn, true);
    try {
      await addDoc(collection(db, 'clips'), { userId: auth.currentUser.uid, campaignId: k.id, campaignTitle: k.title, channelId: ch.id, channelHandle: ch.handle, platform: ch.platform, url, title: String(f.title || '').trim().slice(0, 90),
        declaredViews: Math.min(10000000000, Math.max(0, parseInt(f.views) || 0)), views: 0, rate: k.rate, earn: 0, status: 'pending', reason: '', createdAt: serverTimestamp(), reviewedAt: null });
      closeModal(); toast(t('Clip envoyé ! En attente de validation.')); clipFilter = 'all'; view = 'clips'; await refresh(true);
    } catch (err) { toast(errMsg(err), 'err') } finally { busy(btn, false) }
  };
};
A.delClip = async id => {
  if (!await confirmBox(t('Retirer ce clip ?'), t('Le clip sera retiré de la file de validation.'), t('Retirer'))) return;
  try { await deleteDoc(doc(db, 'clips', id)); toast(t('Clip retiré.')); await refresh(true) } catch (e) { toast(errMsg(e), 'err') }
};
A.deleteMe = async () => {
  if (me.isAdmin) return toast(t('Le compte administrateur ne peut pas être supprimé depuis le site.'), 'err');
  if (!await confirmBox(t('Supprimer ton compte ?'), t('Ton compte, tes clips et ton historique seront définitivement supprimés. Ton solde non retiré sera perdu.'), t('Supprimer définitivement'))) return;
  const u = auth.currentUser;
  try {
    const b = writeBatch(db);
    D.clips.forEach(c => b.delete(doc(db, 'clips', c.id)));
    D.pays.forEach(p => b.delete(doc(db, 'payouts', p.id)));
    D.channels.forEach(c => b.delete(doc(db, 'channels', c.id)));
    b.delete(doc(db, 'leaderboard', u.uid)); b.delete(doc(db, 'users', u.uid));
    await b.commit();
    await deleteUser(u); toast(t('Compte supprimé.'));
  } catch (e) { toast(errMsg(e), 'err') }
};
</script>
</body>
</html>
