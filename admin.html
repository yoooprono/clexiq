<style>
:root{
  --bg:#060B1A;--surface:#0C1428;--surface2:#121C36;--border:#1D2A4A;
  --text:#EAF1FB;--muted:#8796B5;
  --primary:#19E3B5;--primary2:#3FF3CC;--cyan:#22C7E6;--green:#34D399;--amber:#F5B544;--red:#F0506E;
  --grad:linear-gradient(135deg,#2EF2C2 0%,#16B8DE 100%);--r:14px
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:var(--primary2);text-decoration:none;cursor:pointer}
h1,h2,h3{font-family:'Space Grotesk',Inter,sans-serif;letter-spacing:-.02em;line-height:1.15}
h3{font-size:17px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)}.small{font-size:13px}small{display:block;font-size:12.5px}
.green-t{color:var(--green)}.red-t{color:var(--red)}.amber-t{color:var(--amber)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:11px;border:1px solid transparent;font:600 14px Inter,sans-serif;cursor:pointer;transition:.15s;white-space:nowrap;color:var(--text);background:var(--surface2)}
.btn:hover{filter:brightness(1.1)}
.btn.primary{background:var(--grad);color:#04121F;box-shadow:0 6px 20px -6px rgba(25,227,181,.6)}
.btn.ghost{background:transparent;border-color:var(--border)}.btn.ghost:hover{background:var(--surface2)}
.btn.danger{background:var(--red);color:#fff}.btn.success{background:var(--green);color:#03241A}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:9px}
.btn.lg{height:50px;padding:0 26px;font-size:15px}
.btn.block{width:100%}.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;flex:none;transition:.15s}
.icon-btn:hover{color:var(--text);background:var(--surface2)}
.icon-btn.red:hover{color:var(--red);border-color:var(--red)}.icon-btn.green:hover{color:var(--green);border-color:var(--green)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px}
.card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.row{display:flex;align-items:center}.between{justify-content:space-between}.gap{gap:10px}.grow{flex:1;min-width:0}.center{text-align:center}.wrap{flex-wrap:wrap}.right{text-align:right}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stack>*+*{margin-top:16px}
.stat{display:flex;gap:14px;align-items:center}
.stat .si{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.stat b{font:700 20px 'Space Grotesk',sans-serif;display:block;white-space:nowrap}
.t-primary{color:var(--primary2);background:rgba(25,227,181,.15)}.t-green{color:var(--green);background:rgba(25,211,162,.13)}
.t-cyan{color:var(--cyan);background:rgba(34,199,230,.13)}.t-amber{color:var(--amber);background:rgba(245,181,68,.13)}.t-red{color:var(--red);background:rgba(240,80,110,.13)}
.badge{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted);white-space:nowrap;flex:none}
.badge.green{background:rgba(25,211,162,.13);color:var(--green)}.badge.amber{background:rgba(245,181,68,.13);color:var(--amber)}
.badge.red{background:rgba(240,80,110,.13);color:var(--red)}.badge.primary{background:rgba(25,227,181,.16);color:var(--primary2)}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .5s}
.bar.sm{height:6px;margin:6px 0 4px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--border)}
.li:first-child{border-top:0}
.li .b{color:var(--text);font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .acts{display:flex;gap:6px;flex:none}
.nums{text-align:right;flex:none}.nums b{font-size:14px;display:block;white-space:nowrap}
.plat{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none;cursor:pointer}
.av.sm{width:32px;height:32px;font-size:12px}.av.lg{width:56px;height:56px;font-size:18px}
.form{display:flex;flex-direction:column;gap:14px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{font:500 15px Inter,sans-serif;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:11px 13px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(25,227,181,.2)}
input[readonly]{opacity:.6}
textarea{min-height:90px;resize:vertical}
input[type=color]{padding:3px;height:44px;cursor:pointer}
.check{flex-direction:row;align-items:center;gap:8px;font-weight:500;color:var(--text);cursor:pointer}.check input{width:18px;height:18px;accent-color:var(--primary)}
.checks{display:flex;flex-wrap:wrap;gap:8px 16px}
.hint{font-size:12.5px;color:var(--muted);background:var(--surface2);border-radius:10px;padding:10px 12px;font-weight:500}
.tabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tab{height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--border);background:transparent;color:var(--muted);font:600 13px Inter,sans-serif;cursor:pointer;white-space:nowrap}
.tab span{opacity:.7;margin-left:4px}.tab.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:600;background:rgba(255,255,255,.14);color:#fff}
.chip.sm{background:var(--surface2);color:var(--muted);height:24px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.empty{text-align:center;padding:36px 16px}
.empty .ei{width:56px;height:56px;border-radius:16px;margin:0 auto 14px;display:grid;place-items:center;background:var(--surface2);color:var(--muted)}
.empty p{margin:6px 0 16px}
.search{position:relative;flex:1;min-width:200px}.search input{padding-left:40px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
/* shell */
.app{display:flex;min-height:100vh}
.side{width:248px;flex:none;border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;font:700 19px 'Space Grotesk',sans-serif;padding:4px 8px 22px;color:var(--text)}
.logo em{font-style:normal;font-size:11px;font-family:Inter;font-weight:700;background:var(--surface2);color:var(--amber);padding:2px 7px;border-radius:6px}
.side nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav{display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border-radius:10px;color:var(--muted);font:600 14px Inter,sans-serif;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.nav:hover{background:var(--surface2);color:var(--text)}
.nav.on{background:rgba(25,227,181,.12);color:#fff}.nav.on svg{color:var(--primary2)}
.cnt{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;padding:0 6px;border-radius:99px;display:grid;place-items:center}
.side-foot{border-top:1px solid var(--border);padding-top:12px}
.me{display:flex;align-items:center;gap:10px;padding:6px 8px 10px;min-width:0}.me b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{flex:1;min-width:0;padding:28px 32px 60px;max-width:1260px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}
.top h1{font-size:26px}.top p{margin-top:4px}
.mtop,.bottom{display:none}
.toasts{position:fixed;top:16px;right:16px;left:16px;z-index:200;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none}
.toast{background:var(--surface2);border:1px solid var(--border);border-left:4px solid var(--green);padding:12px 16px;border-radius:10px;font-size:14px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.45);animation:tin .25s;max-width:360px;pointer-events:auto}
.toast.err{border-left-color:var(--red)}.toast.out{opacity:0;transform:translateY(-6px);transition:.3s}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
.modal-bg{position:fixed;inset:0;background:rgba(3,5,12,.72);backdrop-filter:blur(4px);z-index:100;display:grid;place-items:center;padding:16px;animation:tin .2s}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:18px;width:100%;max-width:480px;max-height:90vh;overflow:auto}
.modal.wide{max-width:760px}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:1}
.modal-h h3{font-size:18px}.modal-b{padding:20px}.modal-f{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.kv div{background:var(--surface2);border-radius:10px;padding:10px 12px}.kv b{display:block;font-size:16px}
/* ranks */
.ranks{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:16px 0}
.rk{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px 14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.rk.on{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 12px 32px -12px var(--c)}
.rk-ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.rk-ic svg{width:22px;height:22px}
.rk b{color:var(--c);font-size:14px}
.lb-r{display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px}
.lb-r.me{background:rgba(25,227,181,.13)}
.pos{width:26px;text-align:center;font-weight:800;color:var(--muted);flex:none}
.pos.p1{color:#F5B544}.pos.p2{color:#C3CBDA}.pos.p3{color:#C9875A}
/* campaigns */
.camp{padding:0;overflow:hidden;display:flex;flex-direction:column}
.camp-top{height:112px;padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;position:relative}
.rate b{font:700 22px 'Space Grotesk',sans-serif;color:#fff}.rate small{color:rgba(255,255,255,.75);display:inline;margin-left:4px}
.camp-b{padding:16px;flex:1;display:flex;flex-direction:column}
.camp-b .acts{margin-top:auto;padding-top:14px;display:flex;gap:8px}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;margin-top:6px}
@media(max-width:1100px){.grid4{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:repeat(2,1fr)}.ranks{grid-template-columns:repeat(3,1fr)}}
@media(max-width:820px){
  .side{display:none}.app{flex-direction:column}.main{padding:16px 16px 100px}
  .mtop{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:20}
  .mtop .logo{padding:0;font-size:17px}
  .bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);z-index:20;padding:6px 4px calc(6px + env(safe-area-inset-bottom));overflow-x:auto}
  .bottom a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted);padding:6px 2px;min-width:60px;position:relative}
  .bottom a.on{color:var(--primary2)}.bottom .cnt{position:absolute;top:0;right:8px;min-width:16px;height:16px;font-size:10px}
  .top h1{font-size:22px}.top .btn span{display:none}.top .btn{width:44px;padding:0}
  .grid2,.grid3{grid-template-columns:1fr}.grid4{gap:10px}.card{padding:16px}
  .stat{flex-direction:column;align-items:flex-start;gap:10px}.stat b{font-size:17px}
  .ranks{grid-template-columns:repeat(2,1fr)}.kv{grid-template-columns:1fr 1fr}
  .li{flex-wrap:wrap;row-gap:8px}.li>.grow{flex:1 1 calc(100% - 52px)}.li>.plat+.grow~.nums,.li>.av+.grow~.nums{margin-left:50px;text-align:left}.li>.nums{flex:1}.hide-m{display:none!important}
  .toasts{align-items:stretch}.toast{max-width:none}
}

.land{max-width:1180px;margin:0 auto;padding:0 20px}
.lh{display:flex;justify-content:space-between;align-items:center;padding:18px 0}.lh .logo{padding:0}
.hero{text-align:center;padding:70px 0 50px;position:relative}
.hero:before{content:"";position:absolute;inset:-40px 10% auto;height:380px;background:radial-gradient(closest-side,rgba(25,227,181,.35),transparent),radial-gradient(closest-side at 70% 40%,rgba(34,199,230,.22),transparent);filter:blur(30px);z-index:-1}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:99px;background:var(--surface);border:1px solid var(--border);font-size:13px;font-weight:600;color:var(--muted)}
.pill svg{color:var(--amber);width:16px;height:16px}
.hero h1{font-size:clamp(36px,6.4vw,68px);margin:22px auto 18px;max-width:820px}
.gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero>p{color:var(--muted);font-size:18px;max-width:620px;margin:0 auto 30px}
.hstats{display:flex;justify-content:center;gap:16px;margin-top:46px;flex-wrap:wrap}
.hstats div{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 26px;min-width:160px}
.hstats b{font:700 28px 'Space Grotesk',sans-serif;display:block}
.sec{padding:46px 0}.sec>h2{font-size:30px;text-align:center;margin-bottom:10px}.sec>.grid4,.sec>.grid3{margin-top:24px}
.step{position:relative}.step .si{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;margin-bottom:14px}.step h3{margin-bottom:6px}
.step .num{position:absolute;top:16px;right:18px;font:700 26px 'Space Grotesk',sans-serif;color:var(--border)}
.cta{text-align:center;padding:56px 24px;margin:30px 0;border-radius:22px;background:linear-gradient(135deg,rgba(25,227,181,.25),rgba(34,199,230,.12));border:1px solid var(--border)}
.cta h2{font-size:32px}.cta p{margin:8px 0 22px}
.foot{text-align:center;padding:24px 0 40px;border-top:1px solid var(--border)}
@media(max-width:820px){.hero{padding:40px 0 30px}.hero>p{font-size:16px}.hstats div{min-width:0;flex:1;padding:12px}.hstats b{font-size:22px}.sec{padding:30px 0}.sec>h2{font-size:24px}}

.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(600px 300px at 50% 20%,rgba(25,227,181,.22),transparent)}
.login .card{width:100%;max-width:400px;padding:28px}
.chart{display:flex;align-items:flex-end;gap:10px;height:170px}
.chart>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart i{width:100%;max-width:40px;background:var(--grad);border-radius:7px 7px 3px 3px;min-height:4px;transition:height .5s}
.rk-row{display:grid;grid-template-columns:1.2fr 1fr 64px 2fr 36px;gap:8px;align-items:center;margin-bottom:8px}
.nums b a,.li small a{color:var(--primary2)}
.li .b svg{width:13px;height:13px;vertical-align:-1px;opacity:.6}
@media(max-width:820px){.rk-row{grid-template-columns:1fr 1fr 52px 36px}.rk-row input[name=perks]{grid-column:1/-1;grid-row:2}.rk-row>button{grid-row:1;grid-column:4}.rk-row{padding-bottom:10px;border-bottom:1px solid var(--border);margin-bottom:12px}}

/* ===== Clexiq ===== */
.logo img{width:36px;height:36px;flex:none}
.wm{font:700 21px 'Space Grotesk',Inter,sans-serif;letter-spacing:-.5px;color:#F4F8FF}
.wm .x{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.av{overflow:hidden;background:var(--surface2)}.av img{width:100%;height:100%;object-fit:cover}
.btn.google{background:#fff;color:#1F1F1F;border-color:#DADCE0;width:100%}.btn.google svg{width:18px;height:18px}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;font-weight:600;margin:4px 0}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--border)}
.btn.busy{pointer-events:none;opacity:.7}.btn.busy:after{content:"";width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader{display:grid;place-items:center;min-height:60vh}.loader:after{content:"";width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
.boot{min-height:100vh;display:grid;place-items:center}
.notice{border:1px solid rgba(245,181,68,.35);background:rgba(245,181,68,.08);color:var(--amber);border-radius:12px;padding:12px 14px;font-size:13px;font-weight:500}
.secure{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;justify-content:center}.secure svg{width:14px;height:14px;color:var(--primary)}
a.nav{text-decoration:none}
/* sélecteur de langue */
select.lang{width:auto;height:38px;padding:0 30px 0 12px;font-size:13px;font-weight:600;border-radius:10px;background:var(--surface2);cursor:pointer}
select.lang.sm{height:34px;padding:0 24px 0 8px;font-size:12px}
select.lang.block{width:100%;margin-bottom:10px}
.notice .btn{flex:none}
@media(max-width:820px){.lh select.lang{height:38px}.lh .row.gap{gap:8px}}
/* ===== Organisation façon Kleeq ===== */
.rankpill{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:99px;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent);color:var(--c);font:700 13px Inter,sans-serif;cursor:pointer;box-shadow:0 4px 18px -8px var(--c);white-space:nowrap}
.rankpill svg{width:16px;height:16px}
.bell{position:relative;width:38px;height:38px;border-radius:50%}
.bell .cnt{position:absolute;top:-4px;right:-4px;margin:0;min-width:18px;height:18px;font-size:10px;background:var(--primary);color:#04121F}
.segtabs{display:inline-flex;gap:4px;padding:5px;border-radius:14px;background:var(--surface);border:1px solid var(--border);margin-bottom:18px;max-width:100%;overflow-x:auto}
.segtabs button{height:40px;padding:0 18px;border:0;border-radius:10px;background:transparent;color:var(--muted);font:600 14px Inter,sans-serif;cursor:pointer;white-space:nowrap}
.segtabs button.on{background:var(--text);color:var(--bg)}
.checks-list{display:flex;flex-direction:column;gap:12px}
.ck{display:flex;align-items:center;gap:12px;cursor:pointer}.ck.ok{cursor:default}
.ck b{display:block;font-size:14px}.ck.ok b{text-decoration:line-through;color:var(--muted)}
.ckb{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;border:2px dashed var(--border)}
.ck.ok .ckb{border:0;background:rgba(52,211,153,.15);color:var(--green)}.ckb svg{width:15px;height:15px}
.lockf{position:relative;display:flex;align-items:center}.lockf input{padding-right:84px}
.lockf>svg,.lockf>.badge{position:absolute;right:12px;color:var(--muted)}
.prefrow{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--border);border-radius:14px;background:var(--surface2)}
.prefrow b{display:block}
.langsel{display:inline-flex;flex-direction:row;align-items:center;gap:6px;height:38px;padding:0 4px 0 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface2);color:var(--text);cursor:pointer;flex:none}
.langsel svg{width:16px;height:16px;color:var(--muted)}
.langsel select{width:auto;border:0;background:transparent;padding:0 22px 0 0;height:36px;font:700 13px Inter,sans-serif;box-shadow:none!important;cursor:pointer}
.menu .li{gap:14px;cursor:pointer;padding:14px 4px;color:var(--text);text-decoration:none}.menu .li b{display:block}.menu .li>svg{width:20px;height:20px;color:var(--primary2)}
.li.unread{background:rgba(25,227,181,.06);border-radius:10px;padding-left:8px}
.bottom a svg{width:20px;height:20px}
@media(max-width:820px){.mtop .rankpill{height:32px;padding:0 10px;font-size:12px}.bottom a{min-width:0;font-size:10px}.segtabs{display:flex}.segtabs button{flex:1;padding:0 10px}}
/* ===== Campagnes façon Kleeq ===== */
.ccard{padding:0;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .15s,border-color .15s}
.ccard:hover{transform:translateY(-2px);border-color:var(--primary)}
.ccover,.dcover{position:relative;aspect-ratio:2/1;background-size:cover;background-position:center;background-color:var(--surface2)}
.dcover{border-radius:18px;margin:10px 0 16px;aspect-ratio:2.2/1}
.cbadge{position:absolute;top:12px;left:12px;background:#fff;color:#0E8F62;font:700 12px Inter,sans-serif;padding:6px 12px;border-radius:99px}
.cbadge.off{color:#B4415A}
.cend{position:absolute;top:12px;right:12px;background:rgba(6,11,26,.8);color:#fff;font:700 12px Inter,sans-serif;padding:6px 12px;border-radius:99px}
.cplats{position:absolute;top:12px;right:12px;display:flex;gap:4px}
.cplats i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:800 12px Inter,sans-serif;font-style:normal;color:#fff;border:2px solid rgba(255,255,255,.85)}
.cbrand{position:absolute;left:16px;bottom:14px;font:700 22px 'Space Grotesk',sans-serif;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.4)}
.cbody{padding:16px 18px 18px;display:flex;flex-direction:column;flex:1}
.cbody h3{font-size:18px}
.rpmbox{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;border:1px solid var(--border);border-radius:16px;padding:14px 16px;margin-top:14px;background:var(--surface2)}
.rpmbox>div>b{display:block;font:700 22px 'Space Grotesk',sans-serif;margin:2px 0}.rpmbox .span2 b{font-size:13px}
.rpmbox .span2{grid-column:1/-1}.rpmbox .bar{margin:4px 0 8px}
.cond{margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;margin-right:6px}
.filters{padding:16px 18px}.filters hr{border:0;border-top:1px solid var(--border);margin:14px 0}
.flabel{color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
.fchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.fchip{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:99px;border:1px solid var(--border);background:transparent;color:var(--text);font:600 14px Inter,sans-serif;cursor:pointer}
.fchip span{color:var(--muted);font-weight:700}.fchip .dot{margin:0}
.fchip.on{background:var(--text);color:var(--bg);border-color:var(--text)}.fchip.on span{color:var(--bg);opacity:.6}
.secthead{margin:24px 0 14px;align-items:center}.secthead h2{font-size:22px}
.sortsel{display:inline-flex;flex-direction:row;align-items:center;gap:6px;height:40px;padding:0 6px 0 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text)}
.sortsel svg{width:16px;height:16px;color:var(--muted)}.sortsel select{border:0;background:transparent;width:auto;padding:0 20px 0 0;font:600 13px Inter,sans-serif;box-shadow:none!important}
.faded{opacity:.6}
.back{display:inline-flex;gap:6px;color:var(--muted);font-weight:600;font-size:14px;cursor:pointer}
.dtitle{font-size:28px;margin-bottom:8px}
.dmeta{gap:14px;margin-bottom:18px}.dmeta span{display:inline-flex;align-items:center;gap:6px}.dmeta svg{width:15px;height:15px}
.dgrid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;align-items:start}
.pad0{padding:0}.dsec{padding:16px 18px;border-top:1px solid var(--border)}.dsec:first-child{border-top:0}
.big{font:700 30px 'Space Grotesk',sans-serif}
.rules{padding-left:18px;color:var(--muted);line-height:1.7}
.brief{white-space:pre-line;color:var(--text);line-height:1.7;font-size:14px;word-break:break-word}
.links{display:flex;flex-direction:column;gap:10px;margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
.lnk{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:14px;background:var(--surface2);color:var(--text)}
.lnk b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lnk .grow{min-width:0}
.lic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(25,227,181,.12);color:var(--primary2);flex:none}
.exgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ex{color:var(--text);min-width:0}.ex small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:6px;font-weight:600}
.exthumb{display:grid;place-items:center;aspect-ratio:9/14;border-radius:12px;background-size:cover;background-position:center;color:rgba(255,255,255,.7)}
.exthumb svg{opacity:.0}.ex:hover .exthumb{outline:2px solid var(--primary)}
.rnum{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--primary2);font-weight:800;font-size:13px;flex:none}
/* admin : éditeur de campagne */
.covprev{aspect-ratio:2/1;border-radius:14px;background-size:cover;background-position:center;border:1px dashed var(--border);display:grid;place-items:center;color:var(--muted);font-size:13px}
.rowed{display:grid;grid-template-columns:1fr 1.4fr 36px;gap:8px;align-items:center;margin-bottom:8px}
.exrow{display:grid;grid-template-columns:64px 1fr 36px;gap:10px;align-items:start;padding:10px;border:1px solid var(--border);border-radius:12px;margin-bottom:8px}
.exrow .exthumb{aspect-ratio:9/14;width:64px;border-radius:8px;cursor:pointer;border:1px dashed var(--border)}
.exrow .form{gap:8px}
.minicov{width:64px;height:36px;border-radius:8px;background-size:cover;background-position:center;flex:none}
@media(max-width:1100px){.dgrid{grid-template-columns:1fr}}
@media(max-width:820px){.dtitle{font-size:22px}.secthead h2{font-size:19px}.rowed{grid-template-columns:1fr 36px}.rowed input:nth-child(2){grid-column:1/2}.rowed button{grid-row:1/3;grid-column:2}}

.list.nowrap .li{flex-wrap:nowrap}

/* Compression d'image côté navigateur (pas de stockage externe nécessaire) */
function compressImage(file, maxW, maxBytes) {
  return new Promise((res, rej) => {
    if (!file || !/^image\//.test(file.type)) return rej(new Error('Fichier image invalide.'));
    const fr = new FileReader(); fr.onerror = () => rej(new Error('Lecture impossible.'));
    fr.onload = () => {
      const img = new Image(); img.onerror = () => rej(new Error('Image illisible.'));
      img.onload = () => {
        let w = img.width, h = img.height; if (w > maxW) { h = Math.round(h * maxW / w); w = maxW }
        const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h);
        let q = .82, out = c.toDataURL('image/jpeg', q);
        while (out.length > maxBytes && q > .35) { q -= .08; out = c.toDataURL('image/jpeg', q) }
        if (out.length > maxBytes) return rej(new Error('Image trop lourde, choisis-en une plus légère.'));
        res(out);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* Statistiques publiques des campagnes (vues, clippers, clips, top comptes), recalculées par l'admin */
async function syncCampaignStats(camps, clips) {
  const b = writeBatch(db); let n = 0;
  for (const k of camps) {
    const mine = clips.filter(c => c.campaignId === k.id), ok = mine.filter(c => c.status !== 'rejected'), ap = mine.filter(c => c.status === 'approved');
    const per = {}; ap.forEach(c => { const h = c.channelHandle || '—'; per[h] = (per[h] || 0) + (+c.views || 0) });
    const st = { views: ap.reduce((a, c) => a + (+c.views || 0), 0), spent: Math.round(ap.reduce((a, c) => a + (+c.earn || 0), 0) * 100) / 100, clipsCount: ok.length, clippers: new Set(ok.map(c => c.userId)).size,
      top: Object.entries(per).sort((x, y) => y[1] - x[1]).slice(0, 5).map(([h, v]) => ({ h, v })) };
    if (JSON.stringify([k.views || 0, +k.spent || 0, k.clipsCount || 0, k.clippers || 0, k.top || []]) !== JSON.stringify([st.views, st.spent, st.clipsCount, st.clippers, st.top])) { b.update(doc(db, 'campaigns', k.id), st); Object.assign(k, st); n++ }
  }
  if (n) { try { await b.commit() } catch (e) { console.warn('stats', e) } }
}
async function loadData() {
  const [users, clips, camps, pays, chs] = await Promise.all([
    getDocs(collection(db, 'users')), getDocs(query(collection(db, 'clips'), orderBy('createdAt', 'desc'), limit(2000))),
    getDocs(collection(db, 'campaigns')), getDocs(query(collection(db, 'payouts'), orderBy('createdAt', 'desc'), limit(2000))), getDocs(collection(db, 'channels'))
  ]);
  const U = {}; listOf(users).forEach(u => U[u.id] = u);
  const clipsL = listOf(clips), urlCount = {};
  clipsL.forEach(c => { const k = (c.url || '').toLowerCase(); urlCount[k] = (urlCount[k] || 0) + 1 });
  clipsL.forEach(c => { c.user = U[c.userId]; c.dup = urlCount[(c.url || '').toLowerCase()] > 1 });
  const paysL = listOf(pays); paysL.forEach(p => p.user = U[p.userId]);
  const campsL = listOf(camps).sort(byNewest); campsL.forEach(k => k.nClips = clipsL.filter(c => c.campaignId === k.id).length);
  const chL = listOf(chs).sort(byNewest); chL.forEach(c => c.user = U[c.userId]);
  await syncCampaignStats(campsL, clipsL);
  DATA = { channels: chL, U, users: Object.values(U).filter(u => u.status !== 'deleted').sort(byNewest), clips: clipsL, camps: campsL, pays: paysL };
}
async function show(v, silent) {

    if (aview !== v) return;
    renderShell(AV[v]()); if (v === 'channels') fillChannels(); if (v === 'clips') fillClips(); if (v === 'users') fillUsers(); bindA();
  } catch (e) {

  }
}

A.clipTab = k => { clipSt = k; renderShell(AV.clips()); fillClips() };
A.clipSearch = v => { clipQ = v; fillClips() };
function fillClips() {
  const box = $('#clipList'); if (!box) return; const qq = clipQ.trim().toLowerCase();
  const list = DATA.clips.filter(c => clipSt === 'all' || c.status === clipSt).filter(c => !qq || [c.title, c.url, c.user && c.user.name, c.user && c.user.handle, c.user && c.user.email, c.campaignTitle].join(' ').toLowerCase().includes(qq));
  if (clipSt === 'pending') list.sort((a, b) => tms(a.createdAt) - tms(b.createdAt));
  box.innerHTML = list.length ? `<div class="list">${list.map(c => `<div class="li">${platIc(c.platform)}<div class="grow"><a class="b" href="${safeUrl(c.url)}" target="_blank" rel="noopener noreferrer">${esc(c.title || 'Clip sans titre')} ${ic('ext')}</a>
  <small class="muted"><a data-a="userDetail" data-v="${esc(c.userId)}">${esc(uName(c.user))}</a>${c.channelHandle ? ' · @' + esc(c.channelHandle) : ''} · ${esc(c.campaignTitle || '—')} · ${ago(c.createdAt)}</small>
  ${c.dup ? '<small class="amber-t">⚠ Ce lien a été soumis plusieurs fois</small>' : ''}${c.status === 'rejected' && c.reason ? `<small class="red-t">Motif : ${esc(c.reason)}</small>` : ''}</div>
  <div class="nums"><b>${nf(c.status === 'approved' ? c.views : c.declaredViews)} vues</b><small class="${c.status === 'approved' ? 'green-t' : 'muted'}">${c.status === 'approved' ? money(clipEarn(c)) : 'déclarées'}</small></div>${badge(c.status)}
  <div class="acts">${c.status !== 'approved' ? `<button class="icon-btn green" title="Approuver" data-a="approve" data-v="${esc(c.id)}">${ic('check')}</button>` : `<button class="icon-btn" title="Mettre à jour les vues" data-a="approve" data-v="${esc(c.id)}">${ic('edit')}</button>`}
  ${c.status !== 'rejected' ? `<button class="icon-btn red" title="Refuser" data-a="reject" data-v="${esc(c.id)}">${ic('x')}</button>` : ''}
  <button class="icon-btn red" title="Supprimer" data-a="delClip" data-v="${esc(c.id)}">${ic('trash')}</button></div></div>`).join('')}</div>` : empty('Aucun clip', 'Aucun résultat pour ce filtre.', '', 'film');
}
A.userSearch = v => { userQ = v; fillUsers() };
A.userFilter = v => { userSt = v; fillUsers() };
function fillUsers() {
  const box = $('#userList'); if (!box) return; const qq = userQ.trim().toLowerCase();
  const list = DATA.users.filter(u => userSt === 'all' || u.status === userSt).filter(u => !qq || [u.name, u.email, u.handle, u.country].join(' ').toLowerCase().includes(qq));
  box.innerHTML = list.length ? `<div class="list">${list.map(u => {

A.payTab = k => { paySt = k; renderShell(AV.payouts()) };

/* ---------- Validation des clips (mise à jour atomique des gains) ---------- */
const getClip = id => DATA.clips.find(c => c.id === id);
function applyClipChange(b, c, newStatus, newViews) {
  const oldEarn = c.status === 'approved' ? (+c.earn || 0) : 0, oldViews = c.status === 'approved' ? (+c.views || 0) : 0;
  const nv = newStatus === 'approved' ? newViews : 0, ne = newStatus === 'approved' ? Math.round(nv / 1000 * (+c.rate || 0) * 100) / 100 : 0;
  const dE = ne - oldEarn, dV = nv - oldViews, dA = (newStatus === 'approved' ? 1 : 0) - (c.status === 'approved' ? 1 : 0);
  if (DATA.U[c.userId] && DATA.U[c.userId].status !== 'deleted') {
    if (dE || dV || dA) b.update(doc(db, 'users', c.userId), { earned: increment(dE), views: increment(dV), approved: increment(dA) });
    if (dV && !isAdminEmail(DATA.U[c.userId].email)) b.set(doc(db, 'leaderboard', c.userId), { views: increment(dV) }, { merge: true });
  }
  if (dE && DATA.camps.find(k => k.id === c.campaignId)) b.update(doc(db, 'campaigns', c.campaignId), { spent: increment(dE) });
  return { views: nv, earn: ne };
}
A.approve = id => {
  const c = getClip(id), edit = c.status === 'approved', rate = +c.rate || 0;
  openModal(edit ? 'Mettre à jour les vues' : 'Approuver le clip', `<div class="hint" style="margin-bottom:14px"><b style="color:var(--text)">${esc(c.title || 'Clip sans titre')}</b><br>${esc(uName(c.user))} · ${esc(c.platform)} · ${esc(c.campaignTitle || '—')}<br>Vues déclarées : ${nf(c.declaredViews)}${c.dup ? '<br><span class="amber-t">⚠ Lien soumis plusieurs fois</span>' : ''}<br><a href="${safeUrl(c.url)}" target="_blank" rel="noopener noreferrer">Ouvrir la publication ↗</a></div>
  <form id="apF" class="form"><label>Vues vérifiées (contrôle sur la publication)<input name="views" type="number" inputmode="numeric" min="0" required value="${edit ? c.views : c.declaredViews}"></label>
  <p class="muted small">Tarif : ${money(rate)} / 1K vues → gain du clipper : <b id="apEst" class="green-t"></b></p>
  <button class="btn success block" type="submit">${ic('check')} ${edit ? 'Enregistrer' : 'Approuver le clip'}</button></form>`);
  const inp = $('#apF [name=views]'), upd = () => { $('#apEst').textContent = money((+inp.value || 0) / 1000 * rate) }; inp.oninput = upd; upd();
  $('#apF').onsubmit = async e => {
    e.preventDefault(); const btn = e.target.querySelector('button'); busy(btn, true);
    try {
      const b = writeBatch(db), r = applyClipChange(b, c, 'approved', Math.max(0, parseInt(inp.value) || 0));
      b.update(doc(db, 'clips', id), { status: 'approved', views: r.views, earn: r.earn, reason: '', reviewedAt: serverTimestamp() });
      await b.commit(); closeModal(); toast(edit ? 'Vues mises à jour.' : 'Clip approuvé.'); show(aview, true);
    } catch (err) { toast(errMsg(err), 'err') } finally { busy(btn, false) }
  };
};
const REASONS = ['Hors brief', 'Lien invalide ou vidéo supprimée', 'Vues suspectes (bots ou achat de vues)', 'Qualité insuffisante', 'Doublon', 'Marque non mentionnée'];
A.reject = id => {
  const c = getClip(id);
  openModal('Refuser le clip', `<form id="rjF" class="form"><label>Motif<select name="r">${REASONS.map(r => `<option>${r}</option>`).join('')}</select></label>
  <label>Précision pour le clipper (optionnel)<textarea name="d" maxlength="200" placeholder="Explique ce qui doit être corrigé…"></textarea></label>
  ${c.status === 'approved' ? '<p class="hint">Ce clip était approuvé : ses gains seront retirés du solde du clipper.</p>' : ''}
  <button class="btn danger block" type="submit">${ic('x')} Refuser le clip</button></form>`);
  $('#rjF').onsubmit = async e => {
    e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)), btn = e.target.querySelector('button'); busy(btn, true);
    try {
      const b = writeBatch(db); applyClipChange(b, c, 'rejected', 0);
      b.update(doc(db, 'clips', id), { status: 'rejected', views: 0, earn: 0, reason: (f.r + (f.d.trim() ? ' : ' + f.d.trim() : '')).slice(0, 300), reviewedAt: serverTimestamp() });
      await b.commit(); closeModal(); toast('Clip refusé.'); show(aview, true);
    } catch (err) { toast(errMsg(err), 'err') } finally { busy(btn, false) }
  };
};
A.delClip = async id => {
  const c = getClip(id);
  if (!await confirmBox('Supprimer ce clip ?', c.status === 'approved' ? 'Ce clip est approuvé : ses gains seront retirés du solde du clipper. Action définitive.' : 'Le clip sera supprimé définitivement.', 'Supprimer')) return;
  try { const b = writeBatch(db); applyClipChange(b, c, 'rejected', 0); b.delete(doc(db, 'clips', id)); await b.commit(); toast('Clip supprimé.'); show(aview, true) } catch (e) { toast(errMsg(e), 'err') }
};

/* ---------- Utilisateurs ---------- */
A.userDetail = id => {
  const u = DATA.U[id]; if (!u) return toast('Utilisateur introuvable.', 'err');
  const r = rankOf(u.views || 0).cur, cl = DATA.clips.filter(c => c.userId === id), adm = isAdminEmail(u.email);
  const cnt = s => cl.filter(c => c.status === s).length;
  openModal('Profil utilisateur', `<div class="row gap">${avatar(u.name, u.photo, r.color, 'lg')}<div class="grow"><h3>${esc(u.name || '—')}${u.pseudo ? ` <span class="muted" style="font-size:14px">· ${esc(u.pseudo)}</span>` : ''}</h3><small class="muted">${esc(u.email)} · ${u.country ? flag(u.country) + ' ' + esc(countryName(u.country)) : 'Pays non défini'}</small><small class="muted">Inscrit le ${dt(u.createdAt)}</small></div>${u.status === 'active' ? '<span class="badge green">Actif</span>' : '<span class="badge red">Suspendu</span>'}</div>
  <div class="kv"><div><small class="muted">Rang</small><b style="color:${safeColor(r.color)}">${esc(r.name)}</b></div><div><small class="muted">Vues vérifiées</small><b>${nf(u.views || 0)}</b></div><div><small class="muted">Clips</small><b>${cnt('approved')} ✓ · ${cnt('pending')} ⏳ · ${cnt('rejected')} ✕</b></div>
  <div><small class="muted">Gains totaux</small><b>${money(u.earned)}</b></div><div><small class="muted">Payé</small><b>${money(u.paid)}</b></div><div><small class="muted">Solde</small><b class="green-t">${money(balanceOf(u))}</b></div></div>
  <h3 style="margin:6px 0">Chaînes</h3>${(() => { const L = DATA.channels.filter(c => c.userId === id); return L.length ? `<div class="list">${L.map(c => `<div class="li">${platIc(c.platform)}<div class="grow"><a class="b" href="${safeUrl(chLink(c))}" target="_blank" rel="noopener noreferrer">@${esc(c.handle)} ${ic('ext')}</a><small class="muted">${esc(c.platform)} · code ${esc(c.code)}</small></div>${badge(c.status, CHST)}</div>`).join('')}</div>` : '<p class="muted small">Aucune chaîne.</p>' })()}
  <h3 style="margin:14px 0 6px">Derniers clips</h3>${cl.length ? `<div class="list">${cl.slice(0, 10).map(c => `<div class="li">${platIc(c.platform)}<div class="grow"><a class="b" href="${safeUrl(c.url)}" target="_blank" rel="noopener noreferrer">${esc(c.title || 'Clip sans titre')}</a><small class="muted">${dt(c.createdAt)} · ${nf(c.status === 'approved' ? c.views : c.declaredViews)} vues</small></div>${badge(c.status)}</div>`).join('')}</div>` : '<p class="muted small">Aucun clip.</p>'}
  ${adm ? '' : `<div class="modal-f wrap"><button class="btn ghost" data-a="sendReset" data-v="${esc(u.email)}">${ic('mail')} Lien de réinitialisation</button>${u.country ? `<button class="btn ghost" data-a="resetCountry" data-v="${esc(u.id)}">Débloquer le pays</button>` : ''}${u.pseudo ? `<button class="btn ghost" data-a="resetPseudo" data-v="${esc(u.id)}">Débloquer le pseudo</button>` : ''}<button class="btn ghost" data-a="toggleUser" data-v="${esc(u.id)}">${ic(u.status === 'active' ? 'ban' : 'check')} ${u.status === 'active' ? 'Suspendre' : 'Réactiver'}</button><button class="btn danger" data-a="delUser" data-v="${esc(u.id)}">${ic('trash')} Supprimer</button></div>`}`, { wide: true });
};
A.toggleUser = async id => {
  const u = DATA.U[id]; if (!u || isAdminEmail(u.email)) return; const susp = u.status === 'active';
  if (!await confirmBox((susp ? 'Suspendre ' : 'Réactiver ') + (u.name || u.email) + ' ?', susp ? 'Le compte sera bloqué : plus aucune connexion, soumission ni retrait possible.' : 'L\'utilisateur pourra de nouveau utiliser Clexiq.', susp ? 'Suspendre' : 'Réactiver', susp)) return;
  try {
    const b = writeBatch(db); b.update(doc(db, 'users', id), { status: susp ? 'suspended' : 'active' });
    if (susp) b.delete(doc(db, 'leaderboard', id)); else b.set(doc(db, 'leaderboard', id), { name: u.name, handle: u.handle || '', photo: u.photo || '', views: u.views || 0 });
    await b.commit(); toast(susp ? 'Compte suspendu.' : 'Compte réactivé.'); show(aview, true);
  } catch (e) { toast(errMsg(e), 'err') }
};
A.delUser = async id => {
  const u = DATA.U[id]; if (!u || isAdminEmail(u.email)) return;
  if (!await confirmBox('Supprimer le compte de ' + (u.name || u.email) + ' ?', 'Ses clips, retraits et son profil seront effacés, et l\'adresse sera bloquée sur Clexiq. Action irréversible.', 'Supprimer définitivement')) return;
  try {
    const ops = [];
    DATA.clips.filter(c => c.userId === id).forEach(c => ops.push(b => b.delete(doc(db, 'clips', c.id))));
    DATA.pays.filter(p => p.userId === id).forEach(p => ops.push(b => b.delete(doc(db, 'payouts', p.id))));
    DATA.channels.filter(c => c.userId === id).forEach(c => ops.push(b => b.delete(doc(db, 'channels', c.id))));
    if (u.pseudo) ops.push(b => b.delete(doc(db, 'pseudos', u.pseudo)));
    ops.push(b => b.delete(doc(db, 'leaderboard', id)));
    ops.push(b => b.set(doc(db, 'users', id), { name: 'Compte supprimé', email: u.email, handle: '', country: '', photo: '', status: 'deleted', createdAt: u.createdAt || serverTimestamp(), deletedAt: serverTimestamp(), views: 0, earned: 0, paid: 0, pending: 0, approved: 0, lastPayout: '' }));
    for (let i = 0; i < ops.length; i += 450) { const b = writeBatch(db); ops.slice(i, i + 450).forEach(f => f(b)); await b.commit() }
    closeModal(); toast('Compte supprimé.'); show(aview, true);
  } catch (e) { toast(errMsg(e), 'err') }
};
A.sendReset = async email => {
  try { await sendPasswordResetEmail(auth, email); toast('Lien de réinitialisation envoyé à ' + email) } catch (e) { toast(errMsg(e), 'err') }
};

/* ---------- Campagnes ---------- */

const exRow = (e = {}) => `<div class="exrow"><label class="exthumb" style='${/^(https:\/\/|data:image\/)/.test(e.thumb || '') ? `background-image:url("${esc(e.thumb)}")` : ''}' title="Choisir une miniature">${e.thumb ? '' : '+'}<input type="file" accept="image/*" hidden data-ch="exThumb"><input type="hidden" name="ex_thumb" value="${esc(e.thumb || '')}"></label>

A.rmRow = (v, el) => (el.closest('.rowed') || el.closest('.exrow')).remove();
A.addLink = () => { if ($('#lkRows').children.length >= 10) return toast('10 liens maximum.', 'err'); $('#lkRows').insertAdjacentHTML('beforeend', linkRow()) };
A.addEx = () => { if ($('#exRows').children.length >= 12) return toast('12 exemples maximum.', 'err'); $('#exRows').insertAdjacentHTML('beforeend', exRow()) };
A.coverFile = async (v, el) => {
  const f = el.files[0]; if (!f) return;
  try { const url = await compressImage(f, 1100, 260000); $('#cpF [name=cover]').value = url; $('#covPrev').style.backgroundImage = `url("${url}")`; $('#covPrev').textContent = ''; toast('Image prête (' + Math.round(url.length / 1024) + ' Ko).') } catch (e) { toast(e.message, 'err') }

};
A.coverUrl = v => { const p = $('#covPrev'); if (/^https:\/\//.test(v)) { $('#cpF [name=cover]').value = v; p.style.backgroundImage = `url("${v.replace(/"/g, '')}")`; p.textContent = '' } };
A.coverClear = () => { $('#cpF [name=cover]').value = ''; $('#cpF [name=coverUrl]').value = ''; const p = $('#covPrev'); p.style.backgroundImage = ''; p.textContent = 'Aucune image' };
A.exThumb = async (v, el) => {
  const f = el.files[0]; if (!f) return; const box = el.closest('.exthumb');
  try { const url = await compressImage(f, 360, 45000); box.querySelector('[name=ex_thumb]').value = url; box.style.backgroundImage = `url("${url}")`; [...box.childNodes].forEach(n => { if (n.nodeType === 3) n.remove() }) } catch (e) { toast(e.message, 'err') }
  el.value = '';
};

  $('#cpF').onsubmit = async e => {
    e.preventDefault(); const f = e.target, fd = new FormData(f), pf = fd.getAll('pf'), btn = f.querySelector('button[type=submit]');
    if (!pf.length) return toast('Choisis au moins une plateforme.', 'err');
    const links = [...f.querySelectorAll('#lkRows .rowed')].map(r => ({ label: r.querySelector('[name=lk_label]').value.trim().slice(0, 60), url: r.querySelector('[name=lk_url]').value.trim() })).filter(l => l.url);
    if (links.some(l => !/^https:\/\/\S+$/.test(l.url))) return toast('Chaque lien doit commencer par https://', 'err');
    const examples = [...f.querySelectorAll('#exRows .exrow')].map(r => ({ title: r.querySelector('[name=ex_title]').value.trim().slice(0, 80), url: r.querySelector('[name=ex_url]').value.trim(), thumb: r.querySelector('[name=ex_thumb]').value })).filter(x => x.url || x.title || x.thumb);
    if (examples.some(x => !/^https:\/\/\S+$/.test(x.url))) return toast('Chaque exemple doit avoir un lien de vidéo en https://', 'err');
    const sA = fd.get('startAt'), eA = fd.get('endAt'), start = sA ? new Date(sA) : new Date(), end = eA ? new Date(eA) : null;
    if (end && end <= start) return toast('La date de fin doit être après le début.', 'err');
    const v = { title: fd.get('title').trim(), brand: fd.get('brand').trim(), type: fd.get('type'), cover: fd.get('cover') || '', description: fd.get('description').trim(), rules: fd.get('rules').trim(), links,
      rate: cents(fd.get('rate')), budget: cents(fd.get('budget')), platforms: pf, status: fd.get('status'), color: fd.get('color'), startAt: Timestamp.fromDate(start), endAt: end ? Timestamp.fromDate(end) : null };
    if (!(v.rate > 0) || !(v.budget > 0)) return toast('RPM et budget doivent être positifs.', 'err');
    busy(btn, true);
    try {
      const ref = id ? doc(db, 'campaigns', id) : doc(collection(db, 'campaigns')), b = writeBatch(db);
      if (id) b.update(ref, v); else b.set(ref, { ...v, spent: 0, views: 0, clipsCount: 0, clippers: 0, top: [], createdAt: serverTimestamp() });
      b.set(doc(db, 'campaignExtras', ref.id), { examples });
      await b.commit();
      closeModal(); toast(id ? 'Campagne mise à jour.' : 'Campagne créée et visible par les clippers.'); show('campaigns', true);
    } catch (err) { toast(errMsg(err), 'err') } finally { busy(btn, false) }
  };
};
A.toggleCamp = async id => {
  const k = DATA.camps.find(c => c.id === id), st = k.status === 'active' ? 'paused' : 'active';
  try { await updateDoc(doc(db, 'campaigns', id), { status: st }); toast(st === 'active' ? 'Campagne activée.' : 'Campagne mise en pause.'); show('campaigns', true) } catch (e) { toast(errMsg(e), 'err') }
};
A.delCamp = async id => {
  const k = DATA.camps.find(c => c.id === id);
  if (DATA.clips.some(c => c.campaignId === id && c.status === 'approved')) return toast('Des clips approuvés y sont liés : passe-la plutôt en « Terminée ».', 'err');
  if (!await confirmBox('Supprimer « ' + k.title + ' » ?', 'La campagne et ses clips en attente ou refusés seront supprimés.', 'Supprimer')) return;
  try { const b = writeBatch(db); DATA.clips.filter(c => c.campaignId === id).forEach(c => b.delete(doc(db, 'clips', c.id))); b.delete(doc(db, 'campaignExtras', id)); b.delete(doc(db, 'campaigns', id)); await b.commit(); toast('Campagne supprimée.'); show('campaigns', true) } catch (e) { toast(errMsg(e), 'err') }
};

/* ---------- Retraits ---------- */
async function setPay(id, st) {
  const p = DATA.pays.find(x => x.id === id);
  if (!await confirmBox(st === 'paid' ? 'Confirmer le paiement ?' : 'Refuser ce retrait ?', st === 'paid' ? `Confirme que tu as bien envoyé <b>${money(p.amount)}</b> en USDT (réseau BEP20) à ${esc(p.userName || uName(p.user))}, adresse <b style="word-break:break-all">${esc(p.account)}</b>.` : 'Le montant sera recrédité sur le solde du clipper.', st === 'paid' ? 'Marquer comme payé' : 'Refuser', st !== 'paid')) return;
  try {
    const b = writeBatch(db);
    b.update(doc(db, 'payouts', id), { status: st, processedAt: serverTimestamp() });
    if (p.user && p.user.status !== 'deleted') b.update(doc(db, 'users', p.userId), st === 'paid' ? { pending: increment(-p.amount), paid: increment(p.amount) } : { pending: increment(-p.amount) });
    await b.commit(); toast(st === 'paid' ? 'Retrait marqué comme payé.' : 'Retrait refusé, montant recrédité.'); show('payouts', true);
  } catch (e) { toast(errMsg(e), 'err') }
}
A.payPaid = id => setPay(id, 'paid'); A.payReject = id => setPay(id, 'rejected');

/* ---------- Rangs & paramètres ---------- */
const rkRow = r => `<div class="rk-row"><input name="name" required maxlength="20" value="${esc(r.name)}" placeholder="Nom" aria-label="Nom"><input name="min" type="number" min="0" required value="${r.min_views}" placeholder="Vues min." aria-label="Vues minimum"><input name="color" type="color" value="${safeColor(r.color)}" aria-label="Couleur"><input name="perks" maxlength="80" value="${esc(r.perks)}" placeholder="Avantages" aria-label="Avantages"><button type="button" class="icon-btn red" data-a="rmRk" aria-label="Retirer">${ic('trash')}</button></div>`;
A.addRk = () => $('#rkRows').insertAdjacentHTML('beforeend', rkRow({ name: '', min_views: '', color: '#3FF3CC', perks: '' }));
A.rmRk = (v, el) => el.closest('.rk-row').remove();
function bindA() {
  const rk = $('#rkF'); if (rk) rk.onsubmit = async e => {
    e.preventDefault(); const btn = rk.querySelector('button[type=submit]');
    const rows = [...rk.querySelectorAll('#rkRows .rk-row')].map(r => ({ name: r.querySelector('[name=name]').value.trim().slice(0, 20), min_views: Math.max(0, parseInt(r.querySelector('[name=min]').value) || 0), color: safeColor(r.querySelector('[name=color]').value), perks: r.querySelector('[name=perks]').value.trim().slice(0, 80) })).filter(r => r.name);
    if (!rows.length) return toast('Il faut au moins un rang.', 'err'); if (!rows.some(r => r.min_views === 0)) return toast('Un rang doit commencer à 0 vue.', 'err');
    if (new Set(rows.map(r => r.min_views)).size !== rows.length) return toast('Deux rangs ont le même seuil.', 'err');
    busy(btn, true); try { await setDoc(doc(db, 'settings', 'main'), { ranks: rows.sort((a, b) => a.min_views - b.min_views) }, { merge: true }); toast('Rangs enregistrés.'); show('ranks', true) } catch (err) { toast(errMsg(err), 'err') } finally { busy(btn, false) }
  };
  const sf = $('#setF'); if (sf) sf.onsubmit = async e => {
    e.preventDefault(); const f = Object.fromEntries(new FormData(sf)), btn = sf.querySelector('button'); busy(btn, true);
    try { await setDoc(doc(db, 'settings', 'main'), { platformName: f.platformName.trim().slice(0, 30), currency: 'USD', minPayout: Math.max(1, cents(f.minPayout) || 20), supportEmail: f.supportEmail.trim().slice(0, 120), trainingUrl: /^https:\/\/\S+$/.test((f.trainingUrl || '').trim()) ? f.trainingUrl.trim().slice(0, 300) : '' }, { merge: true }); toast('Paramètres enregistrés.'); show('settings', true) }
    catch (err) { toast(errMsg(err), 'err') } finally { busy(btn, false) }
  };
}
</script>
